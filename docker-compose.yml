services:
  postgres:
    image: postgres:17
    container_name: tea-market-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: tea_market
      POSTGRES_USER: tea_market
      POSTGRES_PASSWORD: tea_market_dev_password

    ports:
      - "5432:5432"

    volumes:
      - tea_market_postgres_data:/var/lib/postgresql/data
      - ./database:/database

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U tea_market -d tea_market"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tea_market_postgres_data: